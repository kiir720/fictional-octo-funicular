<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="8K Wallpapers">
  <!-- Dark tile. The "8K" is drawn as shapes, not text, so it looks the same on
       every system instead of depending on whatever font the viewer has.
       The 4-unit border lands on exactly 1px at 16px and 2px at 32px, which
       keeps it crisp in a browser tab instead of smearing across two rows. -->
  <defs><clipPath id="band"><rect x="0" y="15" width="64" height="34"/></clipPath></defs>
  <rect x="2" y="2" width="60" height="60" rx="12.5" fill="#0e0e12" stroke="#6366f1" stroke-width="4"/>
  <!-- the 8: two stroked loops, the top one a little smaller -->
  <g fill="none" stroke="#a5b4fc" stroke-width="6.2">
    <ellipse cx="20.6" cy="23.6" rx="6.2" ry="5.5"/>
    <ellipse cx="20.6" cy="38.2" rx="7.6" ry="7.7"/>
  </g>
  <!-- the K: stem and two arms, clipped to the cap height so the arm ends are
       cut flat like real type -->
  <g clip-path="url(#band)" fill="none" stroke="#a5b4fc" stroke-width="6.4">
    <path d="M38.2 10 L38.2 54"/>
    <path d="M38.1 38.7 L55.5 9"/>
    <path d="M45 28.6 L56.4 54"/>
  </g>
</svg>
