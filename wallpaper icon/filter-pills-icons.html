<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Filter Pills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FF7A3D;
    --accent-2:#FF9A5C;
    --ease:cubic-bezier(.2,.9,.25,1);
  }
  html[data-theme="dark"]{
    --bg:radial-gradient(130% 120% at 50% -20%,#161A24,#0A0B0F);
    --pill:#161923;
    --pill-hover:#1D212C;
    --edge:#2A2F3B;
    --edge-hover:#3A4152;
    --text:#C7CDD9;
    --text-hover:#FFFFFF;
    --ico:#8B93A4;
    --shadow:0 8px 22px rgba(0,0,0,.4);
    --tog-bg:#161923;
  }
  html[data-theme="light"]{
    --bg:radial-gradient(130% 120% at 50% -20%,#FFFFFF,#EDF0F5);
    --pill:#FFFFFF;
    --pill-hover:#F4F6FA;
    --edge:#E3E7EF;
    --edge-hover:#CDD4E0;
    --text:#3A4353;
    --text-hover:#141A24;
    --ico:#8790A0;
    --shadow:0 8px 20px rgba(70,80,100,.14);
    --tog-bg:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);min-height:100vh;font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    padding:60px 20px;transition:background .3s var(--ease);
  }

  /* theme toggle top-right */
  .top{position:fixed;top:20px;right:22px}
  .tog{width:42px;height:42px;border-radius:50%;background:var(--tog-bg);border:1px solid var(--edge);display:grid;place-items:center;cursor:pointer;transition:.25s var(--ease)}
  .tog:hover{border-color:var(--accent)}
  .tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tog svg{width:17px;height:17px;stroke:var(--accent);fill:var(--accent);transition:transform .4s var(--ease)}
  .tog:active svg{transform:rotate(40deg) scale(.9)}

  /* pill row */
  .row{
    display:flex;flex-wrap:wrap;gap:11px;justify-content:center;align-items:center;
    max-width:1000px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:9px;
    padding:11px 20px 11px 16px;border-radius:100px;cursor:pointer;
    background:var(--pill);border:1px solid var(--edge);
    color:var(--text);font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
    transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent;
  }
  .pill .ico{
    width:18px;height:18px;flex-shrink:0;color:var(--ico);
    stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;
    transition:color .2s var(--ease),transform .3s var(--ease);
  }
  .pill:hover{
    background:var(--pill-hover);border-color:var(--edge-hover);color:var(--text-hover);
    transform:translateY(-2px);box-shadow:var(--shadow);
  }
  .pill:hover .ico{color:var(--accent);transform:scale(1.1)}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* active / selected */
  .pill.active{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#12100E;
    box-shadow:0 6px 18px rgba(255,122,61,.4);transform:none;
  }
  .pill.active .ico{color:#12100E}
  .pill.active:hover{transform:translateY(-2px)}

  .hint{font-size:12px;color:var(--ico);letter-spacing:2px;text-transform:uppercase;font-weight:600}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="tog" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M22 12h-2.5M4.5 12H2M19 5l-1.8 1.8M6.8 17.2 5 19M19 19l-1.8-1.8M6.8 6.8 5 5"/></svg>
  </button>
</div>

<div class="hint">Filter by style</div>
<div class="row" id="row"></div>

<script>
  // 12 filter pills, each with a bespoke icon on the same 24 grid
  const PILLS = [
    ["iPhone Wallpapers", '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 5h4"/><path d="M11 19h2"/>', true],
    ["Cute kawaii",       '<path d="M12 20c-4-2.5-8-5.3-8-9.7a4.4 4.4 0 0 1 8-2.6 4.4 4.4 0 0 1 8 2.6c0 4.4-4 7.2-8 9.7Z"/><path d="M9.5 10.5h.01M14.5 10.5h.01"/><path d="M10.8 13c.7.6 1.7.6 2.4 0"/>'],
    ["UltraWide HD Monitor", '<rect x="2.5" y="6" width="19" height="9" rx="1.5"/><path d="M8 19h8M12 15v4"/><path d="M5 10.5h1.5M17.5 10.5H19"/>'],
    ["Cool 4K",           '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 15V9l-2 3.5h3.5"/><path d="M14 15V9M14 12l3-3M14.5 11.5L17 15"/>'],
    ["Black",             '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z"/>'],
    ["Aesthetic backgrounds", '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9" r="1.8"/><path d="M3 16.5l5-4 3.5 2.5L16 10l5 4.5"/>'],
    ["Space",             '<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/><path d="M18.5 5.5h.01M5.5 18h.01"/>'],
    ["Abstract",          '<circle cx="8" cy="8" r="4"/><rect x="12.5" y="4" width="7.5" height="7.5" rx="1.5"/><path d="M6 14.5l4 5.5 4-5.5z"/>'],
    ["Minimal",           '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/>'],
    ["Neon",              '<path d="M13 3l-8 10h6l-1 8 8-10h-6z"/>'],
    ["Nature",            '<path d="M12 21v-5"/><path d="M12 16c-3.4 0-6-2-6-5.4S8.6 3 12 3s6 3.9 6 7.6S15.4 16 12 16Z"/><path d="M12 4v11M8.7 7.8 12 9.3l3.3-1.5M8.2 11.5 12 13l3.8-1.5"/>'],
    ["Gradient",          '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 13.5l16-7M4 18l16-7" opacity=".55"/>'],
  ];

  const row = document.getElementById('row');
  PILLS.forEach(([name,ico,active])=>{
    const el = document.createElement('button');
    el.className = 'pill' + (active ? ' active' : '');
    el.innerHTML = `<svg class="ico" viewBox="0 0 24 24">${ico}</svg><span>${name}</span>`;
    row.appendChild(el);
  });

  // single-select active
  row.addEventListener('click', e=>{
    const p = e.target.closest('.pill'); if(!p) return;
    row.querySelector('.active')?.classList.remove('active');
    p.classList.add('active');
  });

  // ---- theme toggle ----
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const moon = toggle.querySelector('.i-moon');
  const sun  = toggle.querySelector('.i-sun');
  function applyTheme(t){
    root.setAttribute('data-theme', t);
    const dark = t === 'dark';
    moon.style.display = dark ? '' : 'none';
    sun.style.display  = dark ? 'none' : '';
    toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  toggle.addEventListener('click', ()=>applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
  applyTheme('dark');
</script>
</body>
</html>
