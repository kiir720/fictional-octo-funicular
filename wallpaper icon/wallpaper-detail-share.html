<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Detail — Share & Resolutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FF7A3D;
    --accent-2:#FF9A5C;
    --ease:cubic-bezier(.2,.9,.25,1);
  }
  html[data-theme="dark"]{
    --bg:radial-gradient(130% 120% at 50% -20%,#14171F,#0A0B0F);
    --bar:#12141B;
    --chip:#171A23;
    --chip-hover:#1E222D;
    --edge:#282D39;
    --edge-hover:#3A4152;
    --text:#D2D7E1;
    --text-dim:#8B93A4;
    --ico:#9AA2B2;
    --shadow:0 14px 34px rgba(0,0,0,.5);
    --menu:#171A23;
  }
  html[data-theme="light"]{
    --bg:radial-gradient(130% 120% at 50% -20%,#FFFFFF,#EEF1F6);
    --bar:#F5F7FB;
    --chip:#FFFFFF;
    --chip-hover:#F1F4F9;
    --edge:#E3E7EF;
    --edge-hover:#CDD4E0;
    --text:#28303D;
    --text-dim:#6B7385;
    --ico:#7E8698;
    --shadow:0 14px 30px rgba(70,80,100,.16);
    --menu:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);min-height:100vh;font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    padding:60px 20px;transition:background .3s var(--ease);color:var(--text);
  }

  /* theme toggle */
  .top{position:fixed;top:20px;right:22px}
  .tog{width:42px;height:42px;border-radius:50%;background:var(--chip);border:1px solid var(--edge);display:grid;place-items:center;cursor:pointer;transition:.25s var(--ease)}
  .tog:hover{border-color:var(--accent)}
  .tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tog svg{width:17px;height:17px;stroke:var(--accent);fill:var(--accent);transition:transform .4s var(--ease)}
  .tog:active svg{transform:rotate(40deg) scale(.9)}

  /* stats line */
  .stats{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:.2px}
  .stats .s{display:inline-flex;align-items:center;gap:7px}
  .stats svg{width:15px;height:15px;stroke:var(--ico);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .stats .dot{width:3px;height:3px;border-radius:50%;background:var(--text-dim);opacity:.5}
  .stats b{color:var(--text)}

  /* share row */
  .share{display:flex;gap:12px;align-items:center}
  .sbtn{
    width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:none;transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s;
    position:relative;
  }
  .sbtn svg{width:20px;height:20px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sbtn:hover{transform:translateY(-3px) scale(1.05)}
  .sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .sbtn.c1{background:#E23B5A}  /* pin-style */
  .sbtn.c1:hover{box-shadow:0 8px 20px rgba(226,59,90,.45)}
  .sbtn.c2{background:#3B6BE2} /* social blue */
  .sbtn.c2:hover{box-shadow:0 8px 20px rgba(59,107,226,.45)}
  .sbtn.c3{background:#2FB3E8} /* sky */
  .sbtn.c3:hover{box-shadow:0 8px 20px rgba(47,179,232,.45)}
  .sbtn.c4{background:#F0631F} /* orange */
  .sbtn.c4:hover{box-shadow:0 8px 20px rgba(240,99,31,.45)}
  .sbtn.link{background:var(--chip);border:1px solid var(--edge)}
  .sbtn.link svg{stroke:var(--ico)}
  .sbtn.link:hover{box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .sbtn.c6{background:#1EA672} /* share green */
  .sbtn.c6:hover{box-shadow:0 8px 20px rgba(30,166,114,.45)}
  /* copied toast */
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#12100E;font-size:13px;font-weight:700;
    padding:11px 20px;border-radius:100px;opacity:0;pointer-events:none;
    transition:.3s var(--ease);box-shadow:0 10px 30px rgba(255,122,61,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* resolutions bar */
  .resbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    background:var(--bar);border:1px solid var(--edge);border-radius:16px;
    padding:16px 22px;max-width:1000px;transition:background .3s var(--ease),border-color .3s var(--ease);
  }
  .reslabel{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.3px;margin-right:4px;white-space:nowrap}
  .dd{position:relative}
  .dd-btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--chip);border:1px solid var(--edge);color:var(--text);
    font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;
    transition:.2s var(--ease);
  }
  .dd-btn:hover{background:var(--chip-hover);border-color:var(--edge-hover);transform:translateY(-1px)}
  .dd-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dd-btn .ico{width:18px;height:18px;color:var(--ico);stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:color .2s}
  .dd-btn:hover .ico{color:var(--accent)}
  .dd-btn .caret{width:11px;height:11px;stroke:var(--text-dim);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
  .dd.open .dd-btn{border-color:var(--accent)}
  .dd.open .caret{transform:rotate(180deg)}
  .dd.open .dd-btn .ico{color:var(--accent)}

  .menu{
    position:absolute;top:calc(100% + 8px);left:0;min-width:100%;z-index:30;
    background:var(--menu);border:1px solid var(--edge);border-radius:12px;
    padding:6px;box-shadow:var(--shadow);
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:.2s var(--ease);
  }
  .dd.open .menu{opacity:1;visibility:visible;transform:none}
  .menu button{
    display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;
    background:none;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;
    padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s;
  }
  .menu button:hover{background:var(--chip-hover)}
  .menu button .res{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums}
  .menu button:hover .res{color:var(--accent)}

  @media(max-width:640px){.resbar{gap:10px;padding:14px}.reslabel{width:100%;text-align:center;margin:0 0 4px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="tog" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M22 12h-2.5M4.5 12H2M19 5l-1.8 1.8M6.8 17.2 5 19M19 19l-1.8-1.8M6.8 6.8 5 5"/></svg>
  </button>
</div>

<!-- stats -->
<div class="stats">
  <span class="s"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><b>2</b> views</span>
  <span class="dot"></span>
  <span class="s"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg><b>0</b> downloads</span>
  <span class="dot"></span>
  <span class="s"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Added Jul 4, 2026</span>
</div>

<!-- share -->
<div class="share">
  <button class="sbtn c1" aria-label="Save to board" title="Save">
    <svg viewBox="0 0 24 24"><path d="M6 21l1.5-6M9.5 4.5C7 5.5 5.5 8 5.5 10.5c0 1.8 1.2 3 2.6 3 1 0 1.7-.7 1.7-1.7 0-1.2-.9-1.8-.9-3 0-1 .8-1.8 2-1.8 1.6 0 2.7 1.3 2.7 3.2 0 2.4-1.3 4.3-3.3 4.3-1 0-1.9-.6-2.2-1.3"/><path d="M14 4.5c2.6.5 4.5 2.6 4.5 5.3 0 3-2 5.4-4.8 5.4-1 0-1.9-.4-2.4-1"/></svg>
  </button>
  <button class="sbtn c2" aria-label="Share to feed" title="Share">
    <svg viewBox="0 0 24 24"><path d="M14 8V6.5c0-.8.5-1.3 1.3-1.3H17V2.3h-2.4C12.4 2.3 11 3.9 11 6.2V8H8.5v3H11v10h3V11h2.3l.5-3H14Z"/></svg>
  </button>
  <button class="sbtn c3" aria-label="Share as post" title="Share">
    <svg viewBox="0 0 24 24"><path d="M21 5.5c-.8.4-1.6.6-2.5.7A4 4 0 0 0 20 4c-.9.5-1.8.9-2.8 1.1a4 4 0 0 0-6.9 3.7A11.4 11.4 0 0 1 3 4.5a4 4 0 0 0 1.3 5.4c-.7 0-1.3-.2-1.9-.5v.05a4 4 0 0 0 3.2 3.9c-.6.2-1.2.2-1.8.1a4 4 0 0 0 3.7 2.8A8 8 0 0 1 2 18.1a11.3 11.3 0 0 0 6.1 1.8c7.4 0 11.4-6.1 11.4-11.4v-.5c.8-.6 1.5-1.3 2-2.1Z"/></svg>
  </button>
  <button class="sbtn c4" aria-label="Share to community" title="Share">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><circle cx="8.5" cy="12.5" r="1.3" fill="#fff" stroke="none"/><circle cx="15.5" cy="12.5" r="1.3" fill="#fff" stroke="none"/><path d="M9 16c.9.7 2 1 3 1s2.1-.3 3-1"/><path d="M17 7.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM17 6l-4.5-1"/></svg>
  </button>
  <button class="sbtn link" id="copyBtn" aria-label="Copy link" title="Copy link">
    <svg viewBox="0 0 24 24"><path d="M9 15l6-6M10.5 6l1-1a4 4 0 0 1 5.6 5.6l-1 1M13.5 18l-1 1a4 4 0 0 1-5.6-5.6l1-1"/></svg>
  </button>
  <button class="sbtn c6" aria-label="More share options" title="More">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.2"/><circle cx="17" cy="6" r="2.2"/><circle cx="17" cy="18" r="2.2"/><path d="M8 11l7-4M8 13l7 4"/></svg>
  </button>
</div>

<!-- resolutions -->
<div class="resbar" id="resbar">
  <span class="reslabel">More Resolutions:</span>
</div>

<div class="toast" id="toast">Link copied ✓</div>

<script>
  const CARET = '<svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

  // device dropdowns, each with its own icon + real resolution options
  const DEVICES = [
    ["Desktop",
      '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
      [["HD","1366×768"],["Full HD","1920×1080"],["2K","2560×1440"],["4K UHD","3840×2160"],["5K","5120×2880"],["8K","7680×4320"]]],
    ["Mobiles",
      '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
      [["HD","720×1280"],["Full HD","1080×1920"],["QHD","1440×2560"],["4K","2160×3840"]]],
    ["Tablets",
      '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M11 18h2"/>',
      [["Standard","1620×2160"],["Retina","2048×2732"],["4K","2400×3200"]]],
    ["iPhone",
      '<rect x="6.5" y="2" width="11" height="20" rx="3"/><path d="M9.5 4.5h5"/><path d="M11 19.5h2"/>',
      [["iPhone SE","750×1334"],["iPhone 15","1179×2556"],["15 Pro Max","1290×2796"]]],
    ["iPad",
      '<rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><circle cx="12" cy="18.7" r=".9"/>',
      [["iPad mini","1488×2266"],["iPad Air","1640×2360"],["iPad Pro 12.9","2048×2732"]]],
  ];

  const resbar = document.getElementById('resbar');
  DEVICES.forEach(([name,ico,opts])=>{
    const dd = document.createElement('div');
    dd.className = 'dd';
    const menuItems = opts.map(([label,res])=>`<button><span>${label}</span><span class="res">${res}</span></button>`).join('');
    dd.innerHTML = `
      <button class="dd-btn">
        <svg class="ico" viewBox="0 0 24 24">${ico}</svg>
        <span>${name}</span>${CARET}
      </button>
      <div class="menu">${menuItems}</div>`;
    resbar.appendChild(dd);
  });

  // dropdown open/close (single open at a time)
  const dds = [...document.querySelectorAll('.dd')];
  document.addEventListener('click',e=>{
    const btn = e.target.closest('.dd-btn');
    const inMenu = e.target.closest('.menu button');
    if(btn){
      const dd = btn.parentElement;
      const wasOpen = dd.classList.contains('open');
      dds.forEach(d=>d.classList.remove('open'));
      if(!wasOpen) dd.classList.add('open');
    } else if(inMenu){
      // pick a resolution -> close, show toast
      inMenu.closest('.dd').classList.remove('open');
      showToast('Resolution selected ✓');
    } else {
      dds.forEach(d=>d.classList.remove('open'));
    }
  });

  // copy link + toast
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'),1800);
  }
  document.getElementById('copyBtn').addEventListener('click',()=>{
    const url = location.href;
    if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
    showToast('Link copied ✓');
  });

  // theme toggle
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const moon = toggle.querySelector('.i-moon'), sun = toggle.querySelector('.i-sun');
  function applyTheme(t){
    root.setAttribute('data-theme',t);
    const dark = t==='dark';
    moon.style.display = dark?'':'none';
    sun.style.display  = dark?'none':'';
    toggle.setAttribute('aria-label', dark?'Switch to light mode':'Switch to dark mode');
  }
  toggle.addEventListener('click',()=>applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
  applyTheme('dark');
</script>
</body>
</html>
